name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --production
      - name: Simulate SSH Deploy
        run: |
          echo "================================="
          echo "  DEPLOIEMENT VIA SSH (SIMULATION)"
          echo "================================="
          echo "Connexion au serveur : OK"
          echo "Transfert des fichiers : OK"
          echo "npm install --production : OK"
          node index.js &
          sleep 2
          curl -s http://localhost:3000/ping
          kill %1
          echo "Application deployee avec succes !"
          echo "================================="
